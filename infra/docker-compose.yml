version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: afyasmart-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-afya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-afya}
      POSTGRES_DB: ${POSTGRES_DB:-afyasmart}
    ports:
      - "5433:5432"  # 5432 inatumika na PostgreSQL ya system
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-afya}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
