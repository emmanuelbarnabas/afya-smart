<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Afya Smart — USSD Simulator</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --green: #1a7a3a;
      --red: #b00020;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }
    header {
      background: #0f172a;
      color: #fff;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { font-size: 18px; margin: 0; }
    .container { max-width: 520px; margin: 0 auto; padding: 16px; }
    .simulator {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .simulator textarea {
      width: 100%;
      height: 80px;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
      font-size: 13px;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      resize: vertical;
    }
    .phone {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .phone label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 6px; }
    .phone input {
      width: 100%;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
    }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .actions button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .actions .test-button {
      background: var(--green);
      color: #fff;
    }
    .actions .demo-button {
      background: #3b82f6;
      color: #fff;
    }
    .screen {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      min-height: 90px;
      white-space: pre-line;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }
    .screen .label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .screen.end {
      border-color: var(--red);
      background: #fff5f5;
    }
    .screen.con {
      border-color: var(--green);
    }
    .result {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      padding: 6px;
    }
    .legend {
      display: flex;
      gap: 12px;
      font-size: 12px;
      color: var(--muted);
    }
    .legend span { padding: 2px 8px; border-radius: 4px; }
    .legend .con { background: #f0fdf4; border: 1px solid #86efac; }
    .legend .end { background: #fef7f7; border: 1px solid #fca5a5; }
  </style>
</head>
<body>
  <header>
    <h1>Afya Smart &mdash; USSD Simulator</h1>
    <span class="sub">Web clone of the Africa's Talking USSD session</span>
  </header>

  <div class="container">
    <div class="phone">
      <label for="phone">Phone number (Africa's Talking sends this as `phoneNumber`)</label>
      <input id="phone" type="tel" value="+255712345678" />
    </div>

      <div class="simulator">
      <label for="text">Session history</label>
      <div id="chain-display" style="font-size:12px;color:#6b7280;background:#f9fafb;padding:6px;border-radius:4px;border:1px solid #e5e7eb;min-height:32px;">No session yet</div>
      <div style="margin-top:8px;">
        <label for="text" style="font-size:13px;color:#374151;">Answer for the current screen</label>
        <textarea id="text" placeholder="Type your answer (1, 2, 3...)" rows="1" style="width:100%;"></textarea>
      </div>
      <div class="actions" style="margin-top:8px;">
        <button class="test-button" id="send">Send</button>
        <button class="demo-button" id="demo">Start new session</button>
      </div>
      <div class="legend" style="margin-top:8px;">
        <span class="con">CON = keep session open &middot; END = close session</span>
      </div>
    </div>

    <div class="screen" id="screen">
      <div class="label">Screen</div>
      Bofya Send ili kuanza (menu itaonekana hapa).
    </div>

    <div class="screen" id="raw">
      <div class="label">Raw HTTP response</div>
      <pre id="raw-body"></pre>
    </div>

    <div class="result" id="result">Enter a phone number and answers, then Send.</div>
  </div>

  <script>
    // USSD session state (mirrors the real Africa's Talking session flow).
    let sessionPhone = document.getElementById("phone").value.trim();
    let sessionChain = "";   // answers joined with *, e.g. "1*1*30"
    let sessionActive = true;

    const screen = document.getElementById("screen");
    const raw = document.getElementById("raw-body");
    const result = document.getElementById("result");
    const chainDisplay = document.getElementById("chain-display");
    const textInput = document.getElementById("text");

    function updateChainDisplay() {
      if (sessionChain === "") {
        chainDisplay.textContent = "No session yet — start a new registration.";
      } else {
        const parts = sessionChain.split("*").filter(Boolean);
        chainDisplay.textContent = `Session chain (${parts.length} answers): ${sessionChain}`;
      }
    }

    // POST one accumulated answer-chain to /ussd the way Africa's Talking does.
    // The handler reads text.split("*") and uses the LAST element, so we
    // rebuild the full chain on every send (USSD sessions are sequential).
    async function send() {
      const phone = document.getElementById("phone").value.trim();
      const text = document.getElementById("text").value.trim();

      let chainToSend = sessionChain;
      if (text && sessionChain === "") {
        chainToSend = text;                       // first answer: chain = the answer
      } else if (text) {
        chainToSend = sessionChain + "*" + text;  // later answer: append
      }

      const payload = new URLSearchParams({ phoneNumber: phone, text: chainToSend });
      result.textContent = "Sending...";

      const res = await fetch("/ussd", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: payload,
      });

      const body = await res.text();
      raw.textContent = `[HTTP ${res.status}] ${res.headers.get("content-type")}\n${body}`;

      // Render the reply as screens.  The handler's reply is ONE of:
      //   "CON <next question>"   (keep session open)
      //   "END <final message>"   (close session — e.g. RED patient)
      const lines = body.split("\n");
      let html = "";
      for (const line of lines) {
        if (line.startsWith("CON ")) {
          html += `<div class="screen con">${escapeHtml(line.slice(4))}</div>`;
        } else if (line.startsWith("END ")) {
          html += `<div class="screen end">${escapeHtml(line.slice(4))}</div>`;
        } else {
          html += `<div class="screen">${escapeHtml(line)}</div>`;
        }
      }
      screen.innerHTML = html || '<div class="screen">(no response)</div>';

      // Update session state from the response.
      if (res.ok) {
        const firstLine = lines[0] || "";
        if (firstLine.startsWith("END ")) {
          // Session closed: RED emergency message, queue position, or a menu
          // action (2/3) — all replies that end with END.
          sessionActive = false;
          sessionChain = "";
          const emergency = body.includes("dharura");
          chainDisplay.textContent = emergency
            ? "Session closed — dharura: mgonjwa afike hospitali SASA."
            : "Session closed — fimbo imefungwa.";
          textInput.value = "";
        } else if (firstLine.startsWith("CON ")) {
          // Session still open: the next question is the CON line.
          sessionChain = chainToSend;
          sessionActive = true;
          result.textContent = `Got HTTP ${res.status}. Session still open.`;
        } else {
          sessionActive = false;
          chainDisplay.textContent = "Session closed";
          textInput.value = "";
        }
      } else {
        result.textContent = `Error HTTP ${res.status}: ${body.slice(0, 200)}`;
      }

      updateChainDisplay();
      textInput.focus();
    }

    // Reset the simulator and fetch a fresh menu from the server.
    async function demo() {
      sessionChain = "";
      sessionActive = true;
      updateChainDisplay();
      textInput.value = "";
      screen.innerHTML = '<div class="screen">Starting a new session…</div>';
      raw.textContent = "";
      result.textContent = "";
      await send();   // empty chain -> the server sends the menu
    }

    document.getElementById("send").addEventListener("click", send);
    document.getElementById("demo").addEventListener("click", demo);

    function escapeHtml(s) {
      const div = document.createElement("div");
      div.textContent = s == null ? "" : String(s);
      return div.innerHTML;
    }
  </script>
</body>
</html>
